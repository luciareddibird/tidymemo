<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>なんでも帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@600;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a filing cabinet — index drawer (categories) on the left, cards with coloured index tabs in the middle, a writing sheet that slides over. */
:root{
  --bg:#fef5f3; --paper:#ffffff; --ink:#4a3540; --muted:#8f7480; --line:#f5e2df; --soft:#fdf0ee;
  --accent:#a9cdf0; --accent-ink:#253350; --danger:#b5546f; --warn-bg:#fdf3d6; --warn-ink:#6e5a1c; --mark:#fff0a3; --chip-ink:#4a3540;
  --c0:#f9c9d4; --c1:#fdd8b8; --c2:#fbefb0; --c3:#cdeed3; --c4:#c4e8ec; --c5:#c9ddf7; --c6:#dccff3; --c7:#f5cbe6;
  --display:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --shadow:0 1px 2px rgba(29,39,51,.06),0 4px 14px rgba(29,39,51,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#2b1f23; --paper:#36292e; --ink:#f4e6ea; --muted:#b9a0a9; --line:#4b3940; --soft:#3f3035;
  --accent:#a9cdf0; --accent-ink:#1d2433; --danger:#f0a0b4; --warn-bg:#3b3424; --warn-ink:#f3dea0; --mark:#6a5d2a;
  --c0:#f2b8c6; --c1:#f6caa6; --c2:#efe2a0; --c3:#bfe2c6; --c4:#b4dce1; --c5:#bcd2ef; --c6:#cfc1ea; --c7:#ecbcdb;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#2b1f23; --paper:#36292e; --ink:#f4e6ea; --muted:#b9a0a9; --line:#4b3940; --soft:#3f3035;
  --accent:#a9cdf0; --accent-ink:#1d2433; --danger:#f0a0b4; --warn-bg:#3b3424; --warn-ink:#f3dea0; --mark:#6a5d2a;
  --c0:#f2b8c6; --c1:#f6caa6; --c2:#efe2a0; --c3:#bfe2c6; --c4:#b4dce1; --c5:#bcd2ef; --c6:#cfc1ea; --c7:#ecbcdb;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 48px}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;margin-bottom:18px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{font-family:var(--display);font-weight:900;font-size:1.9rem;letter-spacing:.04em;margin:0;line-height:1.1}
.brand small{color:var(--muted);font-size:.8rem}
.status{font-family:var(--mono);font-size:.72rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.status i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.status.cloud i{background:var(--c3)} .status.local i{background:var(--c1)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:none;padding:4px 12px;font-size:.8rem;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 14px;font-weight:500;font-size:.88rem}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn.danger.solid{background:var(--danger);color:var(--paper);border-color:var(--danger)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:24px;align-items:start}
nav.drawer{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;flex-direction:column;gap:4px}
.drawer h2{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:14px 10px 4px;font-weight:700}
.folder{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:7px 10px;border-radius:8px;font-size:.92rem}
.folder:hover{background:var(--soft)}
.folder[aria-current="true"]{background:var(--paper);box-shadow:var(--shadow);font-weight:700}
.folder .dot{width:12px;height:12px;border-radius:3px;flex:none}
.folder .n{margin-left:auto;font-family:var(--mono);font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.folder.bin .n.alert{color:var(--paper);background:var(--danger);border-radius:999px;padding:0 7px}
.drawer .tools{display:flex;flex-direction:column;gap:6px;margin-top:14px;padding:12px 10px;border-top:1px solid var(--line)}
.drawer .tools .btn{text-align:left}
.searchbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.search{flex:1 1 260px;display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:0 12px}
.search input{border:0;background:none;outline:none;padding:10px 0;width:100%;min-width:0}
.search svg{flex:none;color:var(--muted)}
.banner{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--warn-bg);color:var(--warn-ink);border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:.9rem}
.banner .btn{margin-left:auto}
.viewhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:4px 0 14px}
.viewhead h2{font-family:var(--display);font-weight:600;font-size:1.35rem;margin:0;text-wrap:balance}
.viewhead p{margin:0;color:var(--muted);font-size:.85rem}
.viewhead .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
 .list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--paper);border:1px solid var(--line);border-radius:14px;min-width:0;overflow:hidden}
.item[data-open="true"]{box-shadow:0 2px 14px rgba(120,60,70,.10);border-color:var(--tab)}
.head{display:flex;align-items:center;gap:10px;padding:4px 12px 4px 4px}
.toggle{flex:1;min-width:0;display:flex;align-items:center;gap:12px;border:0;background:none;text-align:left;padding:10px 8px;border-radius:10px}
.toggle:hover{background:var(--soft)}
.chip{flex:none;background:var(--tab);color:var(--chip-ink);font-size:.72rem;font-weight:700;border-radius:999px;padding:2px 10px;max-width:9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tt{flex:1;min-width:0;display:flex;flex-direction:column}
.tt b{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tt small{color:var(--muted);font-size:.78rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.date{flex:none;font-family:var(--mono);font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.chev{flex:none;color:var(--muted);transition:transform .2s}
.item[data-open="true"] .chev{transform:rotate(90deg)}
.content{padding:4px 20px 16px 20px;border-top:1px dashed var(--line);background:color-mix(in srgb,var(--tab) 14%,var(--paper))}
.content .text{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.85;padding-top:12px;margin:0}
.content .foot{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin-top:12px;font-family:var(--mono);font-size:.72rem;color:var(--muted)}
.content .foot .btn{margin-left:auto;font-family:var(--body)}
.why{font-size:.75rem;color:var(--danger);font-weight:500}
.binacts{display:flex;gap:6px;flex:none}
.binacts .btn{padding:4px 12px;font-size:.8rem}
.item .confirm{margin:0 12px 12px}
@media (max-width:520px){.date{display:none}.chip{max-width:6em}.head{flex-wrap:wrap}.binacts{margin-left:auto}}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
.empty{text-align:center;color:var(--muted);padding:48px 16px;border:1px dashed var(--line);border-radius:12px}
.empty strong{display:block;font-family:var(--display);font-size:1.15rem;color:var(--ink);margin-bottom:4px}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--soft);border-radius:8px;padding:8px 10px;font-size:.85rem}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,16,24,.45);display:flex;justify-content:flex-end;z-index:20}
.sheet{width:min(620px,100%);height:100%;background:var(--paper);display:flex;flex-direction:column;box-shadow:-10px 0 30px rgba(0,0,0,.2);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
.sheet .bar .sp{margin-right:auto;font-family:var(--mono);font-size:.72rem;color:var(--muted)}
.sheet .body{flex:1;overflow:auto;padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.sheet input.title{font-family:var(--display);font-weight:600;font-size:1.4rem;border:0;border-bottom:1px solid var(--line);background:none;padding:6px 0;outline:none;width:100%}
.sheet textarea{flex:1;min-height:280px;border:0;background:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,var(--soft) 31px,var(--soft) 32px);line-height:32px;resize:none;outline:none;width:100%;font-size:1rem}
.catpick{display:flex;flex-wrap:wrap;gap:6px}
.catpick button{border:1px solid var(--line);background:none;border-radius:999px;padding:3px 12px 3px 8px;font-size:.82rem;display:flex;align-items:center;gap:6px}
.catpick button[aria-pressed="true"]{border-color:var(--ink);font-weight:700;background:var(--soft)}
.catpick .dot{width:10px;height:10px;border-radius:3px}
.meta{font-family:var(--mono);font-size:.72rem;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap}
/* category manager */
.catrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line)}
.catrow input[type=text]{flex:1 1 140px;min-width:0;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:6px 8px}
.swatches{display:flex;gap:4px;flex-wrap:wrap}
.swatches button{width:22px;height:22px;border-radius:5px;border:2px solid transparent}
.swatches button[aria-pressed="true"]{border-color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:.85rem;z-index:40;box-shadow:var(--shadow)}
.fab{display:none}
@media (max-width:760px){
  .layout{grid-template-columns:minmax(0,1fr)}
  nav.drawer{position:static;flex-direction:row;flex-wrap:nowrap;overflow-x:auto;gap:6px;padding-bottom:4px}
  .drawer h2,.drawer .tools{display:none}
  .folder{width:auto;flex:none;white-space:nowrap;background:var(--paper);border:1px solid var(--line)}
  .brand h1{font-size:1.5rem}
  .mobiletools{display:flex!important}
}
.newrow{display:flex;justify-content:center;margin-bottom:16px}
.btn.new{background:#f6d9b8;border-color:#ecc59a;color:#5a3a22;font-size:1rem;font-weight:700;padding:11px 34px;box-shadow:0 3px 12px rgba(120,60,70,.12)}
.btn.new:hover{background:#f1cca2;border-color:#e2b483}
.mobiletools{display:none;gap:8px;flex-wrap:wrap;margin-top:28px}
/* graph view */
.graph{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden;height:min(68vh,640px);min-height:360px}
.graph canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.gtools{position:absolute;top:10px;right:10px;display:flex;gap:6px}
.gtools .btn{padding:4px 11px;font-size:.85rem}
.ghint{color:var(--muted);font-size:.82rem;margin:10px 4px 0}
/* zettelkasten flow */
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-bottom:12px}
.step{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.step:hover{border-color:var(--muted)}
.step[aria-current="true"]{border-color:var(--ink);box-shadow:var(--shadow)}
.step b{font-family:var(--display);font-weight:600;font-size:1rem}
.step b span{font-family:var(--mono);font-size:.75rem;color:var(--muted);margin-right:6px}
.step small{color:var(--muted);font-size:.74rem;line-height:1.4}
.step em{font-style:normal;font-family:var(--mono);font-size:.72rem;margin-top:4px;background:var(--soft);border-radius:999px;padding:1px 8px}
.step em.on{background:var(--accent);color:var(--accent-ink)}
@media (max-width:900px){.steps{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:760px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}.step small{display:none}}
.tips{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.78rem;color:var(--muted);margin:-2px 2px 12px}
.tips b{color:var(--ink);font-weight:700}
.capture{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.capture input{flex:1 1 240px;min-width:0;border:1px solid var(--line);border-radius:10px;background:var(--paper);padding:10px 12px}
.no{font-family:var(--mono);font-size:.74rem;font-weight:500;color:var(--muted);background:var(--soft);border-radius:6px;padding:0 6px;margin-right:8px;font-variant-numeric:tabular-nums}
.item[data-depth]{margin-left:calc(var(--d,0) * 22px)}
@media (max-width:520px){.item[data-depth]{margin-left:calc(var(--d,0) * 10px)}}
.refs{display:flex;flex-direction:column;gap:4px;margin-top:12px;font-size:.85rem}
.refs a{color:inherit}
.refs .why{color:var(--muted);font-weight:400;font-size:.8rem}
.refs .lbl{font-size:.74rem;color:var(--muted);font-weight:700;letter-spacing:.04em}
.zk{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.zk h3{margin:8px 0 0;font-size:.8rem;letter-spacing:.06em;color:var(--muted);font-weight:700}
.zk .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.zk .row input{flex:1 1 200px;min-width:0;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:6px 10px}
.refrow{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;background:var(--soft);border-radius:10px;padding:8px 10px}
.refrow .tgt{flex:1 1 180px;min-width:0;font-weight:700;overflow-wrap:anywhere}
.refrow input{flex:1 1 220px;min-width:0;border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:5px 9px;font-size:.85rem}
.refrow .btn{padding:3px 10px;font-size:.78rem}
.refrow .x{border:0;background:none;color:var(--muted);font-size:1.1rem;padding:0 4px}
.sugg{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sugg small{color:var(--muted);font-size:.78rem}
.sugg button.s{border:1px dashed var(--muted);background:none;border-radius:999px;padding:2px 10px;font-size:.8rem}
.muted{color:var(--muted);font-size:.82rem;margin:0}
.themes{display:flex;flex-direction:column;gap:10px}
.theme{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.theme header{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.theme header input{flex:1 1 200px;min-width:0;font-family:var(--display);font-weight:600;font-size:1.1rem;border:0;border-bottom:1px solid transparent;background:none;padding:2px 0}
.theme header input:focus{border-bottom-color:var(--line);outline:none}
.theme ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.theme li{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:8px}
.theme li:hover{background:var(--soft)}
.theme li a{flex:1;min-width:0;color:inherit;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.theme li button{border:0;background:none;color:var(--muted);padding:0 5px;font-size:.9rem}
.theme .row{display:flex;gap:8px;flex-wrap:wrap}
.theme .row input{flex:1 1 200px;min-width:0;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:6px 10px}
.newtheme{display:flex;gap:8px;flex-wrap:wrap}
.newtheme input{flex:1 1 240px;min-width:0;border:1px solid var(--line);border-radius:10px;background:var(--paper);padding:9px 12px}
.tpick{display:flex;flex-wrap:wrap;gap:6px}
.tpick button{border:1px solid var(--line);background:none;border-radius:999px;padding:2px 11px;font-size:.8rem}
.tpick button[aria-pressed="true"]{border-color:var(--ink);background:var(--soft);font-weight:700}
.wl{color:inherit;text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><h1 data-t="appName">なんでも帳</h1><small data-t="tagline"></small></div>
    <span class="status" id="status"><i></i><span id="statusText">…</span></span>
    <div class="seg" role="group" aria-label="Language">
      <button id="lang-ja" data-lang="ja">日本語</button><button id="lang-en" data-lang="en">English</button>
    </div>
  </header>

  <div class="layout">
    <nav class="drawer" id="drawer" aria-label="Folders"></nav>
    <main style="min-width:0">
      <div id="staleBanner"></div>
      <div class="steps" id="steps"></div>
      <div class="tips" id="tips"></div>
      <form class="capture" id="capture"><input id="cap" autocomplete="off" aria-label="capture"><button class="btn primary" data-t="collect">集める</button><button type="button" class="btn" id="newBtn" data-t="newMemo">＋ 新しいメモ</button></form>
      <div class="searchbar">
        <label class="search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="q" type="search" autocomplete="off">
        </label>
        <select id="sort" class="btn" aria-label="Sort"></select>
      </div>
      <div class="viewhead" id="viewhead"></div>
      <div id="grid" class="list"><div class="empty"><strong data-t="loading">読み込み中…</strong></div></div>
      <div class="mobiletools" id="mobiletools"></div>
    </main>
  </div>
</div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<div id="overlay"></div>
<div id="toastHost"></div>

<script>
(function(){
const DAY=864e5, STALE_DAYS=183;
const T={
 ja:{appName:"なんでも帳",tagline:"思いついたことを、ひとまずここへ。",newMemo:"＋ 新しいメモ",loading:"読み込み中…",
  all:"すべてのメモ",categories:"カテゴリー",bin:"ゴミ箱",uncat:"未分類",search:"キーワードで検索（タイトル・本文）",
  sortUpdated:"更新が新しい順",sortViewed:"最近見た順",sortTitle:"タイトル順",
  manageCats:"カテゴリーを整理",exportJ:"バックアップを保存",importJ:"バックアップを読み込む",
  cloud:"クラウドに保存中",local:"この端末に保存中",saved:"保存しました",
  count:n=>`${n} 件`,resultsFor:(n,q)=>`「${q}」で ${n} 件見つかりました`,
  emptyAllT:"まだメモがありません",emptyAll:"右上の「新しいメモ」から、最初の一枚を書いてみましょう。タイトルをクリックすると中身がひらきます。",
  emptyCatT:"このカテゴリーは空です",emptyCat:"メモを開いて、カテゴリーを選ぶと仕分けられます。",
  emptySearchT:"見つかりませんでした",emptySearch:"別のことばで探してみてください。",
  emptyBinT:"ゴミ箱は空です",emptyBin:"半年以上ひらいていないメモは、自動的にここへ移ります。",
  binIntro:"半年以上ひらいていないメモと、ゴミ箱へ移したメモです。一枚ずつ「残す」か「消す」を選べます。",
  keep:"残す",del:"消す",keepAll:"すべて残す",emptyBinBtn:"ゴミ箱を空にする",
  confirmEmpty:n=>`${n} 件のメモを完全に消します。元に戻せません。`,confirmDel:"このメモを完全に消します。元に戻せません。",

 ja:{cats:["アイデア","買い物","読書","仕事","暮らし"]},

/* ---------- state ---------- */
let openSet=new Set(), S={settings:null,memos:{}}, lang=null, view={folder:"all",q:"",sort:"updated"}, store=null, staleJustMoved=0, editing=null, overlayMode=null, binConfirm=null;
const $=s=>document.querySelector(s);
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const t=(k,...a)=>{const v=T[lang][k];return typeof v==="function"?v(...a):v};

lang=ls.get("nandemo.lang")||((navigator.language||"ja").startsWith("ja")?"ja":"en");

function seed(){
  const d=SEEDS[lang], now=Date.now(), cats=d.cats.map((n,i)=>({id:"c"+uid(),name:n,color:[5,0,3,6,4][i]}));
  return {settings:{id:"settings",categories:cats,seeded:true},memos:{}};
}

/* ---------- storage ---------- */
function cacheLocal(){ls.set("nandemo.data",JSON.stringify(S))}
const LocalStore={kind:"local",async putMemo(){cacheLocal()},async delMemo(){cacheLocal()},async putSettings(){cacheLocal()}};
function CloudStore(db,id){
  const col=db.collection("data/users/"+id);
  return {kind:"cloud",
    async load(){const snap=await col.get();const out={settings:null,memos:{}};snap.docs.forEach(d=>{const v=d.data();if(!v)return;if(d.id==="settings")out.settings=v;else if(d.id[0]==="m")out.memos[d.id]=v});return out},
    async putMemo(m){cacheLocal();await col.doc(m.id).set(m)},
    async delMemo(id){cacheLocal();await col.doc(id).delete()},
    async putSettings(s){cacheLocal();await col.doc("settings").set(s)}};
}
async function persist(fn){try{await fn()}catch(e){console.warn(e);toast(t("saveFail"))}}
function setStatus(){const el=$("#status");el.className="status "+(store?store.kind:"");$("#statusText").textContent=store?t(store.kind):"…"}

async function boot(){
  const cached=ls.get("nandemo.data");
  if(cached){try{S=JSON.parse(cached)}catch(e){}}
  if(S.settings)render();
  let db=null,id=null;
  try{
    const claude=window.claude;
    if(claude&&claude.use){
      const [d,u]=await Promise.all([claude.use("db"),claude.use("user")]);
      db=d; id=u?await u.id():null;
    }
  }catch(e){db=null}
  if(db&&id){
    const cs=CloudStore(db,id);
    try{
      const remote=await cs.load();
      store=cs;
      if(remote.settings){S=remote;cacheLocal()}
      else{ if(!S.settings) S=seed(); await persist(async()=>{await cs.putSettings(S.settings);for(const m of Object.values(S.memos))await cs.putMemo(m)}) }
    }catch(e){console.warn(e);store=LocalStore}
  }else store=LocalStore;
  if(!S.settings){S=seed();cacheLocal()}
  for(const m of Object.values(S.memos)) if(m.example){delete S.memos[m.id];persist(()=>store.delMemo(m.id))}
  migrate();
  checkStale(true);
  render();
}

function checkStale(write){
  const now=Date.now(); let n=0;
  for(const m of Object.values(S.memos)){
    if(m.status==="active"&&now-m.viewed>STALE_DAYS*DAY){m.status="bin";m.reason="stale";m.binned=now;n++;if(write&&store)persist(()=>store.putMemo(m))}
  }
  if(n)staleJustMoved+=n;
}

/* ---------- helpers ---------- */
const cats=()=>S.settings.categories;
const catOf=m=>cats().find(c=>c.id===m.cat);
const colorVar=c=>c?`var(--c${c.color})`:"var(--line)";
const fmtDate=ts=>new Date(ts).toLocaleDateString(lang==="ja"?"ja-JP":"en-GB",{year:"numeric",month:lang==="ja"?"numeric":"long",day:"numeric"});
const ago=ts=>t("ago",Math.floor((Date.now()-ts)/DAY));
function hl(text,q){
  const s=esc(text); if(!q) return s;
  const words=q.trim().split(/\s+/).filter(Boolean).map(w=>esc(w).replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));
  if(!words.length) return s;
  return s.replace(new RegExp("("+words.join("|")+")","gi"),"<mark>$1</mark>");
}
const LINK_RE=/\[\[([^\[\]|#\n]+)(?:[|#][^\[\]\n]*)?\]\]/g;
const findByTitle=title=>{const k=title.trim().toLowerCase();return Object.values(S.memos).find(m=>m.status==="active"&&(m.title||"").trim().toLowerCase()===k)};
const URL_RE=/https?:\/\/[^\s<>"'）」]+/g;
const isUrl=s=>/^https?:\/\/\S+$/i.test(s.trim());
function autolink(s,q){let out="",last=0;for(const x of s.matchAll(URL_RE)){out+=hl(s.slice(last,x.index),q)+`<a class="wl" href="${esc(x[0])}" target="_blank" rel="noopener noreferrer">${hl(x[0],q)}</a>`;last=x.index+x[0].length}return out+hl(s.slice(last),q)}
function rich(text,q){let out="",last=0;for(const x of text.matchAll(LINK_RE)){out+=autolink(text.slice(last,x.index),q)+`<a href="#" class="wl" data-link="${esc(x[1].trim())}">${hl(x[0],q)}</a>`;last=x.index+x[0].length}return out+autolink(text.slice(last),q)}
/* zettelkasten (Luhmann): one idea per note, numbered 1, 1/1, 1/1/1…, linked by number, reviewed, listed by theme */
const IVL=[1,3,7,14,30,60,120], REVIEW_MAX=5;
const dueAt=m=>m.review?m.review.next:m.updated+DAY;
const isDue=m=>m.status==="active"&&dueAt(m)<=Date.now();
const segs=no=>String(no||"").split("/").map(n=>parseInt(n,10)||0);
const cmpNo=(a,b)=>{const x=segs(a.no),y=segs(b.no);for(let i=0;i<Math.max(x.length,y.length);i++){const d=(x[i]??-1)-(y[i]??-1);if(d)return d}return 0};
const depth=m=>segs(m.no).length-1;
const allNos=()=>new Set(Object.values(S.memos).map(m=>m.no).filter(Boolean));
function nextTop(){let n=0;for(const no of allNos()){const v=parseInt(no,10);if(v>n)n=v}return String(n+1)}
function nextChild(no){let n=0;const pre=no+"/";for(const x of allNos())if(x.startsWith(pre)&&!x.slice(pre.length).includes("/")){const v=parseInt(x.slice(pre.length),10);if(v>n)n=v}return pre+(n+1)}
const byNo=no=>Object.values(S.memos).find(m=>m.status==="active"&&m.no===no);
const label=m=>`${m.no?m.no+" ":""}${m.title||t("untitled")}`;
function resolveRef(v){
  v=(v||"").trim().replace(/^#/,""); if(!v) return null;
  const head=v.split(/\s+/)[0];
  return byNo(v)||(/^\d+(\/\d+)*$/.test(head)?byNo(head):null)||findByTitle(v)||null;
}
function migrate(){
  const list=Object.values(S.memos).sort((a,b)=>a.created-b.created), changed=[];
  for(const m of list){
    let c=false;
    if(!m.no){m.no=nextTop();c=true}
    if(!Array.isArray(m.refs)){m.refs=[];c=true}
    if(m.links&&m.links.length){const add=m.links.map(l=>l.url).filter(u=>!(m.body||"").includes(u));if(add.length)m.body=(m.body?m.body.replace(/\s+$/,"")+"\n":"")+add.join("\n");delete m.links;c=true}
    else if("links" in m){delete m.links;c=true}
    if("stage" in m){delete m.stage;c=true}
    if(c)changed.push(m);
  }
  if(!Array.isArray(S.settings.themes)){S.settings.themes=[];saveSettings()}
  changed.forEach(m=>persist(()=>store.putMemo(m)));
}
function linkMap(active){
  const ids=new Set(active.map(m=>m.id));
  const byTitle=new Map();active.forEach(m=>{const k=(m.title||"").trim().toLowerCase();if(k&&!byTitle.has(k))byTitle.set(k,m)});
  const out=new Map(),inn=new Map();active.forEach(m=>{out.set(m.id,new Set());inn.set(m.id,new Set())});
  const add=(a,b)=>{if(a!==b&&ids.has(b)){out.get(a).add(b);inn.get(b).add(a)}};
  active.forEach(m=>{
    (m.refs||[]).forEach(r=>add(m.id,r.to));
    for(const x of (m.body||"").matchAll(LINK_RE)){const to=byTitle.get(x[1].trim().toLowerCase());if(to)add(m.id,to.id)}
  });
  return {out,in:inn};
}
const themes=()=>S.settings.themes||(S.settings.themes=[]);
function refsHtml(m,lm){
  const outs=(m.refs||[]).map(r=>({r,x:S.memos[r.to]})).filter(o=>o.x&&o.x.status==="active");
  const ins=[...(lm.in.get(m.id)||[])].map(id=>S.memos[id]).filter(x=>x&&!(m.refs||[]).some(r=>r.to===x.id));
  if(!outs.length&&!ins.length) return "";
  return `<div class="refs">${outs.length?`<span class="lbl">→ ${t("linksH")}</span>`+outs.map(o=>`<span><a href="#" class="wl" data-goto="${o.x.id}">${esc(label(o.x))}</a>${o.r.why?` <span class="why">— ${esc(o.r.why)}</span>`:""}</span>`).join(""):""}
    ${ins.length?`<span class="lbl">← ${t("backlinks")}</span>`+ins.map(x=>`<span><a href="#" class="wl" data-goto="${x.id}">${esc(label(x))}</a></span>`).join(""):""}</div>`;
}
function matches(m,q){const words=q.toLowerCase().trim().split(/\s+/).filter(Boolean);const hay=(m.title+"\n"+m.body).toLowerCase();return words.every(w=>hay.includes(w))}
function toast(msg){const h=$("#toastHost");h.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>h.innerHTML="",2600)}

  document.documentElement.lang=lang;
  document.title=t("appName");
  document.querySelectorAll("[data-t]").forEach(el=>el.textContent=t(el.dataset.t));
  $("#lang-ja").setAttribute("aria-pressed",lang==="ja");$("#lang-en").setAttribute("aria-pressed",lang==="en");
  $("#q").placeholder=t("search");$("#cap").placeholder=t("capPh");
  $("#sort").innerHTML=["updated","viewed","title","no"].map(k=>`<option value="${k}" ${view.sort===k?"selected":""}>${t("sort"+k[0].toUpperCase()+k.slice(1))}</option>`).join("");
  setStatus();
  if(!S.settings) return;
  const all=Object.values(S.memos), active=all.filter(m=>m.status==="active"), binned=all.filter(m=>m.status==="bin");
  const staleInBin=binned.filter(m=>m.reason==="stale").length;
  // drawer
  const f=(key,label,n,dot,cls="")=>`<button class="folder ${cls}" data-folder="${key}" aria-current="${view.folder===key}">${dot?`<span class="dot" style="background:${dot}"></span>`:""}<span>${esc(label)}</span><span class="n ${cls&&staleInBin?"alert":""}">${n}</span></button>`;
  const toolsHtml=`<button class="btn ghost" data-act="cats">${t("manageCats")}</button><button class="btn ghost" data-act="export">${t("exportJ")}</button><button class="btn ghost" data-act="import">${t("importJ")}</button>`;
  $("#drawer").innerHTML=f("all",t("all"),active.length)+f("graph",t("graph"),"")+`<h2>${t("categories")}</h2>`+
    cats().map(c=>f(c.id,c.name,active.filter(m=>m.cat===c.id).length,colorVar(c))).join("")+
    f("none",t("uncat"),active.filter(m=>!catOf(m)).length,"var(--line)")+
    `<h2>&nbsp;</h2>`+f("bin",t("bin"),binned.length,null,"bin")+`<div class="tools">${toolsHtml}</div>`;
  $("#mobiletools").innerHTML=toolsHtml;

    <h3>${t("connect")}</h3>
    <div class="row"><input id="ed-linkto" list="ed-titles" placeholder="${t("linkToPh")}" aria-label="${t("linkToPh")}"><datalist id="ed-titles">${active.slice().sort(cmpNo).map(x=>`<option value="${esc(label(x))}">`).join("")}</datalist><button class="btn" type="button" data-act="linkto">${t("linkTo")}</button></div>
    ${sugg.length?`<div class="sugg"><small>${t("maybe")}:</small>${sugg.map(x=>`<button type="button" class="s" data-addref="${x.id}">＋ ${esc(label(x))}</button>`).join("")}</div>`:""}
    ${look.length?`<div class="sugg"><small>${t("lookback")}:</small>${look.map(x=>`<button type="button" class="s" data-addref="${x.id}">＋ ${esc(label(x))}</button>`).join("")}<button type="button" class="btn ghost" data-act="shuffle">${t("shuffle")}</button></div>`:""}
    ${ins.length?`<h3>← ${t("backlinks")}</h3><div class="sugg">${ins.map(x=>`<a href="#" class="wl" data-goto="${x.id}">${esc(label(x))}</a>`).join(" ")}</div>`:""}
    ${ts.length?`<h3>${t("inThemes")}</h3><div class="tpick">${ts.map(th=>`<button type="button" data-thtoggle="${th.id}" aria-pressed="${th.cards.includes(d.id)}">${esc(th.name)}</button>`).join("")}</div>`:""}
    ${d.isNew?"":`<div class="row" style="margin-top:6px"><button type="button" class="btn" data-act="branch">${t("branch")}</button><small class="muted">${t("branchHint",d.no)}</small></div>`}
  </div>`;
}
function drawOverlay(){
  const o=$("#overlay");
  if(!overlayMode){o.innerHTML="";return}
  if(overlayMode==="edit"){
    const d=editing.draft;
    o.innerHTML=`<div class="scrim" data-act="scrim"><section class="sheet" role="dialog" aria-modal="true" aria-label="${esc(d.title||t("untitled"))}">
      <div class="bar"><span class="sp" id="ed-state">${dirty()?t("unsaved"):""}</span>
        ${d.isNew?"":`<button class="btn danger" data-act="tobin">${t("toBin")}</button>`}
        <button class="btn" data-act="close">${t("close")}</button><button class="btn primary" data-act="save">${t("save")}</button></div>
      ${editing.confirmClose?`<div class="confirm" style="margin:10px 16px 0"><span>${t("unsaved")}</span><button class="btn primary" data-act="saveclose">${t("saveClose")}</button><button class="btn danger" data-act="discard">${t("discard")}</button><button class="btn ghost" data-act="cancelclose">${t("cancel")}</button></div>`:""}
      <div class="body">
        <div class="row" style="display:flex;align-items:center;gap:8px"><span class="no" title="${t("s2")}">${esc(d.no)}</span><input class="title" id="ed-title" placeholder="${t("titlePh")}" value="${esc(d.title)}"></div>
        <div class="catpick" role="group" aria-label="${t("category")}">${cats().map(c=>`<button data-pick="${c.id}" aria-pressed="${d.cat===c.id}"><span class="dot" style="background:${colorVar(c)}"></span>${esc(c.name)}</button>`).join("")}<button data-pick="" aria-pressed="${!catOf(d)}"><span class="dot" style="background:var(--line)"></span>${t("uncat")}</button></div>
        <textarea id="ed-body" placeholder="${t("bodyPh")}">${esc(d.body)}</textarea>
        ${zkPanel(d)}
        <div class="meta"><span>${t("created")} ${fmtDate(d.created)}</span><span>${t("updated")} ${fmtDate(d.updated)}</span></div>
      </div></section></div>`;
    $("#ed-title").oninput=e=>{d.title=e.target.value;$("#ed-state").textContent=dirty()?t("unsaved"):""};
    $("#ed-body").oninput=e=>{d.body=e.target.value;$("#ed-state").textContent=dirty()?t("unsaved"):""};
    $("#ed-linkto").onkeydown=e=>{if(e.key==="Enter"&&!e.isComposing){e.preventDefault();addRef(e.target.value)}};
    document.querySelectorAll("[data-why]").forEach(i=>i.oninput=e=>{d.refs[+i.dataset.why].why=e.target.value;$("#ed-state").textContent=dirty()?t("unsaved"):""});
  }
  if(overlayMode==="cats"){
    o.innerHTML=`<div class="scrim" data-act="scrim"><section class="sheet" role="dialog" aria-modal="true" aria-label="${t("catsTitle")}">
      <div class="bar"><span class="sp" style="font-family:var(--display);font-size:1.1rem;color:var(--ink)">${t("catsTitle")}</span><button class="btn primary" data-act="close">${t("done")}</button></div>
      <div class="body"><p style="margin:0;color:var(--muted);font-size:.85rem">${t("catDelNote")}</p>
      ${cats().map(c=>`<div class="catrow"><input type="text" id="cat-${c.id}" data-catname="${c.id}" value="${esc(c.name)}" aria-label="${t("category")}">
        <div class="swatches">${[0,1,2,3,4,5,6,7].map(i=>`<button data-swatch="${c.id}:${i}" aria-pressed="${c.color===i}" style="background:var(--c${i})" aria-label="colour ${i+1}"></button>`).join("")}</div>
        <button class="btn ghost" data-delcat="${c.id}">${t("delCat")}</button></div>`).join("")}
      <div><button class="btn" data-act="addcat">${t("addCat")}</button></div></div></section></div>`;
    o.querySelectorAll("[data-catname]").forEach(inp=>inp.onchange=e=>{const c=cats().find(x=>x.id===inp.dataset.catname);c.name=e.target.value.trim()||c.name;saveSettings();render()});
  }
}
function saveSettings(){persist(()=>store.putSettings(S.settings))}
async function saveEditor(){
  const d=editing.draft; delete d.isNew; delete d.example;
  d.updated=Date.now(); d.viewed=d.updated;
  S.memos[d.id]=d; editing.orig={...d,refs:d.refs.map(r=>({...r}))}; editing.draft={...d,refs:d.refs.map(r=>({...r}))};
  render(); $("#ed-state").textContent="";
  await persist(()=>store.putMemo(d));
  toast(t("saved")+" · "+t(store.kind));
}
function closeOverlay(force){
  if(overlayMode==="edit"&&!force&&dirty()){editing.confirmClose=true;drawOverlay();return}
  overlayMode=null;editing=null;drawOverlay();render();
}

/* ---------- events ---------- */
document.addEventListener("click",async e=>{
  const el=e.target.closest("[data-thtoggle],[data-insight],[data-addref],[data-rmref],[data-goto],[data-link],[data-g],[data-toggle],[data-folder],[data-open],[data-act],[data-lang],[data-pick],[data-swatch],[data-delcat]");
  if(!el) return;
  if(el.dataset.goto){e.preventDefault();if(overlayMode==="edit"&&dirty()){editing.confirmClose=true;redrawKeep();return}openEditor(el.dataset.goto);return}
  if(el.dataset.addref){addRef(S.memos[el.dataset.addref]);return}
  if(el.dataset.rmref!==undefined){editing.draft.refs.splice(+el.dataset.rmref,1);redrawKeep();return}
  if(el.dataset.thtoggle){const th=themes().find(x=>x.id===el.dataset.thtoggle),id=editing.draft.id;th.cards=th.cards.includes(id)?th.cards.filter(x=>x!==id):[...th.cards,id];if(editing.draft.isNew)await saveEditor();saveSettings();redrawKeep();return}
  if(el.dataset.insight!==undefined){const d=editing.draft,r=d.refs[+el.dataset.insight],x=S.memos[r.to];if(dirty()){await saveEditor();toast(t("saveFirst"))}
    overlayMode=null;openEditor(null,t("insightTitle",d.no,x.no),{no:nextChild(d.no),cat:d.cat,refs:[{to:d.id,why:""},{to:x.id,why:""}]});return}
  if(el.dataset.link!==undefined){e.preventDefault();const to=findByTitle(el.dataset.link);openEditor(to?to.id:null,to?null:el.dataset.link);return}
  if(el.dataset.g){const c=G.canvas;if(el.dataset.g==="fit")fitGraph();else if(c)zoomAt(el.dataset.g==="in"?1.3:1/1.3,c.clientWidth/2,c.clientHeight/2);return}
  if(el.dataset.act==="scrim"&&e.target!==el) return;
  if(el.dataset.lang){lang=el.dataset.lang;ls.set("nandemo.lang",lang);render();if(overlayMode)drawOverlay();return}
  if(el.dataset.folder){view.folder=el.dataset.folder;binConfirm=null;if(view.folder==="bin")staleJustMoved=0;render();return}
  if(el.dataset.toggle){const id=el.dataset.toggle,m=S.memos[id];if(openSet.has(id))openSet.delete(id);else{openSet.add(id);if(m.status==="active"){m.viewed=Date.now();persist(()=>store.putMemo(m))}}render();return}
  if(el.dataset.open){openEditor(el.dataset.open);return}
  if(el.dataset.pick!==undefined){editing.draft.cat=el.dataset.pick||null;const y=$("#ed-body").scrollTop;drawOverlay();$("#ed-body").scrollTop=y;return}
  if(el.dataset.swatch){const [id,i]=el.dataset.swatch.split(":");cats().find(c=>c.id===id).color=+i;saveSettings();drawOverlay();render();return}
  if(el.dataset.delcat){S.settings.categories=cats().filter(c=>c.id!==el.dataset.delcat);if(view.folder===el.dataset.delcat)view.folder="all";saveSettings();drawOverlay();render();return}
  const id=el.dataset.id, m=id&&S.memos[id];
  switch(el.dataset.act){
    case "scrim": case "close": closeOverlay(); break;
    case "save": await saveEditor(); break;
    case "saveclose": await saveEditor(); closeOverlay(true); break;
    case "discard": closeOverlay(true); break;
    case "cancelclose": editing.confirmClose=false; drawOverlay(); break;
    case "tobin": {const o=S.memos[editing.orig.id];o.status="bin";o.reason="manual";o.binned=Date.now();persist(()=>store.putMemo(o));closeOverlay(true);toast(t("movedToBin"));break}
    case "keep": m.status="active";m.viewed=Date.now();delete m.reason;persist(()=>store.putMemo(m));render();toast(t("kept"));break;
    case "del": binConfirm=id; render(); break;
    case "delyes": delete S.memos[id]; binConfirm=null; persist(()=>store.delMemo(id)); render(); toast(t("deleted")); break;
    case "cancelconfirm": binConfirm=null; render(); break;
    case "keepall": for(const x of Object.values(S.memos))if(x.status==="bin"){x.status="active";x.viewed=Date.now();delete x.reason;persist(()=>store.putMemo(x))} render(); toast(t("kept")); break;
    case "emptybin": binConfirm="all"; render(); break;
    case "emptyyes": for(const x of Object.values(S.memos))if(x.status==="bin"){delete S.memos[x.id];persist(()=>store.delMemo(x.id))} binConfirm=null; render(); toast(t("deleted")); break;
    case "cats": overlayMode="cats"; drawOverlay(); break;
    case "addcat": {const used=cats().map(c=>c.color);const color=[0,1,2,3,4,5,6,7].find(i=>!used.includes(i))??0;const c={id:"c"+uid(),name:t("newCatName"),color};cats().push(c);saveSettings();drawOverlay();render();const inp=$("#cat-"+c.id);inp&&(inp.focus(),inp.select());break}
    case "capfocus": $("#cap").focus(); break;
    case "linkto": addRef($("#ed-linkto").value); break;
    case "shuffle": editing.look=null; redrawKeep(); break;
    case "branch": {const d=editing.draft;if(dirty()){await saveEditor();toast(t("saveFirst"))}overlayMode=null;openEditor(null,"",{no:nextChild(d.no),cat:d.cat,refs:[{to:d.id,why:""}]});break}
    case "thadd": themeAdd(el.dataset.th); break;
    case "thdel": themeConfirm=el.dataset.th; render(); break;
    case "thcancel": themeConfirm=null; render(); break;
    case "thdelyes": S.settings.themes=themes().filter(x=>x.id!==el.dataset.th); themeConfirm=null; saveSettings(); render(); break;
    case "thup": case "thdown": case "thrm": {const th=themes().find(x=>x.id===el.dataset.th);const ids=th.cards.filter(id=>S.memos[id]&&S.memos[id].status==="active");const i=+el.dataset.i;
      if(el.dataset.act==="thrm")ids.splice(i,1);else{const j=el.dataset.act==="thup"?i-1:i+1;[ids[i],ids[j]]=[ids[j],ids[i]]}th.cards=ids;saveSettings();render();break}
    case "reviewed": {const step=Math.min((m.review?m.review.step:-1)+1,IVL.length-1);m.review={step,next:Date.now()+IVL[step]*DAY};m.viewed=Date.now();persist(()=>store.putMemo(m));render();toast(t("reviewedT"));break}
    case "tomorrow": m.review={step:m.review?m.review.step:0,next:Date.now()+DAY};m.viewed=Date.now();persist(()=>store.putMemo(m));render();break;
    case "export": exportBackup(); break;
    case "import": $("#importFile").click(); break;
  }
});
$("#newBtn").onclick=()=>openEditor(null);
$("#capture").onsubmit=e=>{
  e.preventDefault();
  const v=$("#cap").value.trim(); if(!v) return;
  const now=Date.now(), url=isUrl(v)?v:null, c=cats().find(c=>c.id===view.folder);
  const m={id:"m"+uid(),no:nextTop(),title:url?svcLabel(url):v.length>40?v.slice(0,40)+"…":v,body:url||v.length>40?v:"",
    refs:[],cat:c?c.id:null,created:now,updated:now,viewed:now,status:"active"};
  S.memos[m.id]=m; persist(()=>store.putMemo(m));
  $("#cap").value=""; render(); toast(t("collected",m.no));
};
$("#q").oninput=e=>{view.q=e.target.value;render()};
$("#sort").onchange=e=>{view.sort=e.target.value;render()};
document.addEventListener("keydown",e=>{
  if(overlayMode==="edit"&&(e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="s"){e.preventDefault();saveEditor()}
  else if(overlayMode&&e.key==="Escape"){closeOverlay()}
  else if(!overlayMode&&e.key==="/"&&document.activeElement.tagName!=="INPUT"){e.preventDefault();$("#q").focus()}
});

async function exportBackup(){
  let dl=null; try{dl=window.claude&&await window.claude.use("downloads")}catch(e){}
  const stamp=new Date().toISOString().slice(0,10);
  if(!dl){
    try{const blob=new Blob([JSON.stringify({app:"nandemo-cho",version:1,exported:Date.now(),...S},null,2)],{type:"application/json"});
      const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`nandemo-backup-${stamp}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast(t("exported"))}
    catch(e){toast(t("exportUnavail"))}
    return}
  try{const r=await dl.save({filename:`nandemo-backup-${stamp}.json`,data:JSON.stringify({app:"nandemo-cho",version:1,exported:Date.now(),...S},null,2)});if(r&&r.status==="saved")toast(t("exported"))}
  catch(e){if(e&&e.code==="unavailable")toast(t("exportUnavail"))}
}
$("#importFile").onchange=async e=>{
  const file=e.target.files[0]; e.target.value=""; if(!file) return;
  try{
    const data=JSON.parse(await file.text());
    if(!data.settings||!data.memos) throw 0;
    for(const c of data.settings.categories||[]) if(!cats().some(x=>x.id===c.id)) cats().push(c);
    let n=0; for(const m of Object.values(data.memos)){ if(!m||!m.id) continue; S.memos[m.id]=m; n++; persist(()=>store.putMemo(m)) }
    if(Array.isArray(data.settings.themes))for(const th of data.settings.themes)if(!themes().some(x=>x.id===th.id))themes().push(th);
    migrate(); saveSettings(); render(); toast(t("imported",n));
  }catch(err){toast(t("importErr"))}
};

render(); boot();
})();
</script>
